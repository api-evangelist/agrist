  reason: no-developer-program
  detail: >-
    AGRIST sells harvesting robots and the bundled AGRIST Ai cultivation-support system directly to
    greenhouse farmers as a turnkey package, and its 48-page WordPress site has no developer,
    documentation, API or integration section at all — contract discovery against agrist.com and
    www.agrist.com returned a hard 404 for /openapi.json, /llms.txt, /apis.json and every named
    /.well-known/ path, the only certificate-issued subdomain (farmpr.agrist.com) no longer resolves
    in DNS, and the single machine-readable surface on the domain is the stock WordPress core REST
    API at /wp-json whose 231 routes are entirely CMS and plugin namespaces (wp/v2, oembed, Wordfence,
    Site Kit, SiteOrigin), not an AGRIST product.
