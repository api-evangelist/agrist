aid: agrist
name: Agrist
description: >-
  AGRIST Inc. (AGRIST株式会社) is a Japanese deep-tech agricultural robotics company founded in October
  2019 and headquartered in Shintomi-cho, Koyu-gun, Miyazaki Prefecture, with an AI robot farm in
  Higashikushira (Kagoshima), an AI robot test facility in Shintomi-cho and the AGRIST Joso Farm in
  Joso City, Ibaraki. Its flagship product is "L", an automatic bell-pepper harvesting robot that
  travels along overhead wires strung between greenhouse rows rather than on ground rails, using
  multiple cameras and a proprietary computer-vision model to find and cut harvest-ready fruit
  through layered foliage; a cucumber harvesting robot followed. Around the hardware the company
  sells AGRIST Ai, a greenhouse cultivation-support and yield-forecasting system fed by robot patrol
  data and environmental sensors, and it operates its own farms plus Smart Agri University (SAU), a
  nine-month smart-agriculture training program. AGRIST is venture-backed through a Series B that
  includes Mizuho Capital, Global Infrastructure Management, Nippon Steel Kowa Real Estate, Nippon
  Express Holdings, Takamiya and Sparx, and has taken more than 27 domestic and international awards
  including a CES 2023 Innovation Award and a Japanese Minister of Agriculture, Forestry and
  Fisheries Award. It is a robotics and farm-operations business, not a software vendor: as of
  2026-09-13 it publishes no developer program, no public API, no SDK and no machine-readable API
  contract of any kind.
